<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

  .cube {
    --cube-cote: 200px;
  }

  * { box-sizing: border-box; }

  body {
    height: 100vh;
    perspective: 25em;
    display: flex;
    justify-content: center;
    align-items: center;
  }

.cube {
  position: relative;
  width:  var(--cube-cote); 
  height: var(--cube-cote);
  font-size: calc(var(--cube-cote) / 1.5);
  color: #fff;
  transform-style: preserve-3d;
}

.cube__face {
  position: absolute;
  width:  var(--cube-cote); 
  height: var(--cube-cote);
  opacity: .5;
  display: flex;
  justify-content: center;
  align-items: center;
}

.cube__face--1 {
  background: cornflowerblue;
  transform: rotateY(0deg) translateZ(calc(var(--cube-cote) / 2));
}
.cube__face--2 {
  background: darkblue;
  transform: rotateY(90deg) translateZ(calc(var(--cube-cote) / 2));
}
.cube__face--3 {
  background: darkcyan;
  transform: rotateY(180deg) translateZ(calc(var(--cube-cote) / 2));
}
.cube__face--4 {
  background: dodgerblue;
  transform: rotateY(270deg) translateZ(calc(var(--cube-cote) / 2));
}
.cube__face--5 {
  background: indigo;
  transform: rotateX(90deg) translateZ(calc(var(--cube-cote) / 2));
}
.cube__face--6 {
  background: rebeccapurple;
  transform: rotateX(-90deg) translateZ(calc(var(--cube-cote) / 2));
}

    </style>
</head>
<body>
  
        <div class="cube">
            <div class="cube__face cube__face--1">1</div>
            <div class="cube__face cube__face--2">2</div>
            <div class="cube__face cube__face--3">3</div>
            <div class="cube__face cube__face--4">4</div>
            <div class="cube__face cube__face--5">5</div>
            <div class="cube__face cube__face--6">6</div>
        </div>
   

</body>
</html>

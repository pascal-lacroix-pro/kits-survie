<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un menu bizeauté</title>
    <style>

        body {
            width: 700px;
            margin: 2em auto;
        }
        .menu--horiz ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .menu--bizeau li {
            transform: skewX(-30deg);
        }
        .menu--horiz li:not(:last-of-type) {
            margin-right: 1px;
        }
        .menu--horiz a {
            display: block;
            background: orange;
            padding: 1em 2em;
            color: #eee;
            text-decoration: none;
        }
        .menu--horiz a:hover {
            background: red;
        }
        .menu--bizeau a span {
            display: block;
            transform: skewX(30deg);
        }


    </style>
</head>
<body>
    <nav class="menu--horiz menu--bizeau">
        <ul>
            <li><a href="#"><span>Lien 1</span></a></li>
            <li><a href="#"><span>Lien 2</span></a></li>
            <li><a href="#"><span>Lien 3</span></a></li>
            <li><a href="#"><span>Lien 4</span></a></li>
            <li><a href="#"><span>Lien 5</span></a></li>
        </ul>
    </nav>
</body>
</html>

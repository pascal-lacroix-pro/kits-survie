<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un menu bizeauté</title>
    <style>

        body {
            width: 700px;
            margin: 2em auto;
            font-family: 'Lucida Sans', 'Lucida Sans Regular', 'Lucida Grande', 'Lucida Sans Unicode', Geneva, Verdana, sans-serif;
        }
        .menu--horiz ul {
            display: flex;
            list-style: none;
            margin: 0;
            padding: 0;
            width: 100%;
            border-radius: 10px;
            overflow: hidden;
        }
        .menu--horiz li {
            flex-grow: 1;
            transition: all 900ms ease-in-out;
        }
        .menu--horiz li:hover {
            flex-grow: 5;
            transition: all 300ms ease-in-out;
        }
        .menu--horiz li:not(:last-of-type) {
            margin-right: 1px;
        }
        .menu--horiz a {
            display: block;
            background: orange;
            padding: 1em 2em;
            color: #eee;
            text-decoration: none;
            text-align: center;  
        }
        .menu--horiz a:hover {
            background: red;
        }


    </style>
</head>
<body>
    <nav class="menu--horiz">
        <ul>
            <li><a href="#">Lien 1</a></li>
            <li><a href="#">Lien 2</a></li>
            <li><a href="#">Lien 3</a></li>
            <li><a href="#">Lien 4</a></li>
            <li><a href="#">Lien 5</a></li>
        </ul>
    </nav>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Défi 6</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
        font-size: 1.2em;
      }

      h1 {
        font-family: "Trebuchet MS", arial, sans-serif;
      }

      .card-user {
        width: 100%;
        max-width: 600px;
        margin: auto;
        padding: 1em 1em 1em calc(100px + 2em);
        background: 1em center / 100px url("images/user3.png") no-repeat,
          linear-gradient(90deg, red, orange);
        color: #fff;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      }
    </style>
  </head>
  <body>
    <!-- 
        Trebuchet MS pour le titre, Cambria pour le texte (1.2em)
    Div à 600px et marge intérieure de 1em partout et de 132px à gauche
    Fond en dégradé du rouge à l'orange à 90deg
    Image de fond sur le div en 90px, à 1em du bord gauche et center en vertical
    Ajoutez une ombre portée sur le div pour faire joli 😃 
    box-shadow: rgba(0,0,0,.5) 0 0 15px;
 -->

    <div class="card-user">
      <h1>John Doe</h1>
      <p>
        Lorem ipsum, dolor sit amet consectetur adipisicing elit. Aut quas
        dignissimos, explicabo laboriosam ullam pariatur ea fugiat.
      </p>
    </div>
  </body>
</html>
